[build-system]
requires = ["hatchling"]
build-backend = "hatchling.build"

[project]
name = "holograim-mcp"
version = "0.1.0"
description = "HologrA.I.m MCP Server — persistent cognitive co-authorship architecture with multi-modal memory, belief networks, and Congress deliberation pipeline"
readme = "README_MCP.md"
requires-python = ">=3.10"
license = "MIT"
authors = [
    { name = "fabledharbinger" },
]

dependencies = [
    "fastmcp>=0.1.0",
    "chromadb>=0.4.0",
    "networkx>=3.0",
    "numpy>=1.24",
    "requests>=2.28",
]

[project.scripts]
holograim-mcp = "server:main"
